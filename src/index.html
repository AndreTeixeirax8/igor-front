       vem na versão VARIÁVEL, com eixo de tamanho óptico (opsz): a própria fonte
       engrossa levemente os traços no texto miúdo, melhorando a leitura. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:opsz,wght@14..32,400..700&display=swap"
